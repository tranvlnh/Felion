services:
  felion-bot:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    env_file:
      - backend/.env
    ports:
      - "3000:3000"

  # Local database for development: `docker compose --profile dev up -d postgres`.
  postgres:
    image: postgres:17
    profiles: ["dev"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: felion
      POSTGRES_PASSWORD: change-me
      POSTGRES_DB: felion
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
