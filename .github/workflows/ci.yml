name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.400

      - name: Restore
        run: dotnet restore Felion.slnx

      - name: Verify formatting
        run: dotnet format Felion.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build Felion.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Felion.slnx --no-build --configuration Release --logger trx --results-directory TestResults
